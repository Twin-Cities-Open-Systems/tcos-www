# Org CI baseline -- PROMPTING_RULES rule 16.
#
# Two layers: hee-check for what only this org knows, standard tools for
# what is standard. hee-check needs no toolchain and no language runtime,
# so it works in every repo including docs-only ones.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  hee-check:
    name: hee-check (org tooling)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tcos-www
        uses: actions/checkout@v4
        with:
          path: tcos-www

      # Check out the tool's home repo rather than vendoring a copy.
      # Vendoring is what produced three divergent security_scanner.py
      # files across the org -- human-execution-engine#468.
      - name: Checkout human-execution-engine (hee-check lives there)
        uses: actions/checkout@v4
        with:
          repository: Twin-Cities-Open-Systems/human-execution-engine
          # Pinned. `stable` advances only after this repo is measured green against
          # the candidate commit; unpinned, a hee tightening turned org repos red with
          # no commit here -- human-execution-engine#633.
          ref: stable
          path: human-execution-engine

      # BLOCKING, and verified green before this workflow was added:
      # hee-check boundary and refs both exit 0 on this repo today.
      # It catches broken file references, hardcoded /home/<user>/ paths,
      # and derived state committed to git.
      - name: hee-check all
        run: human-execution-engine/tooling/bin/hee-check all tcos-www
      # tcos-app owns the shared shell (css/shell.css, js/shell.js and the
      # components in shell.manifest); the copies here must match its main.
      - name: Checkout tcos-app (owns the shared shell)
        uses: actions/checkout@v4
        with:
          repository: Twin-Cities-Open-Systems/tcos-app
          ref: main
          path: tcos-app
      - name: Shared shell has not drifted from tcos-app
        run: sh tcos-www/sync-shell.sh --check tcos-app

  # The lab mirror's payload. lab-pull on pve installs the newest lab-* release
  # into /www/tcos-www, served as lab.tcos.us -- the same path as tcos.app and
  # ham.tcos.app; nothing pushes into the lab by hand. The pages are the
  # COMMITTED ones (the generator reads live sources CI does not have), run
  # through .github's lab_link_transform.py so lab links stay in the lab.
  publish:
    name: publish payload (for lab-pull)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [hee-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only to attach the payload to this build's release
    env:
      KEEP_RELEASES: '5'
    steps:
      - uses: actions/checkout@v4
        with: { path: tcos-www }
      - uses: actions/checkout@v4
        with: { repository: Twin-Cities-Open-Systems/.github, path: dotgithub }
      - name: Build the payload
        run: |
          set -eu
          python3 dotgithub/bin/lab_link_transform.py tcos-www "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          tar -czf "$GITHUB_WORKSPACE/tcos-www-www.tar.gz" \
            activity.html careers.html contact.html contracts.html index.html ir.html people.html story.html \
            css js shell assets
          cd "$GITHUB_WORKSPACE"
          for f in index.html people.html story.html css/site.css css/shell.css js/site.js js/shell.js; do
            tar -tzf tcos-www-www.tar.gz | grep -qx "$f" \
              || { echo "payload is missing $f -- refusing to publish"; exit 1; }
          done
          ls -l tcos-www-www.tar.gz
      - name: Publish this build's payload
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          printf '%s\n' "$SHA" > COMMIT
          tag="lab-$(printf '%s' "$SHA" | cut -c1-12)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
            --title "tcos-www lab payload $tag" \
            --notes "Built by ci from $SHA. The static site for the lab mirror (lab.tcos.us), pulled by lab-pull. Derived state, not a version." \
            tcos-www-www.tar.gz COMMIT
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          echo "published $tag ($SHA)"
      - name: Keep the last few, delete the rest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"lab-\"))]
                  | sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" \
          | while read -r old; do
              [ -n "$old" ] || continue
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "deleted $old"
            done

  ruff:
    name: ruff (1 file(s))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # REPORTING ONLY on first landing, same reason as shellcheck above:
      # ruff was not installed on the authoring host, so it could not be
      # verified green. Same flip condition.
      - name: ruff
        continue-on-error: true
        run: |
          pip install --quiet ruff
          ruff check .
