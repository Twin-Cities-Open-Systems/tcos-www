thesis: 'First dogfood of a general org/user verification API, per Spencer: "will
  expand but dogfood this as the first ... used to verify for stuff like $ make -org
  tcos -user paul to setup a new env." Real precedent found before writing this: tcos-www
  already runs a standalone Workers-based /api/* router (worker/worker.js, deliberately
  separate from the GitHub-App-deployed static-assets Worker) with two routes today
  (POST /api/contact, POST /api/apply) -- add GET /api/people as a third route on
  the same router rather than standing up new infra. Backing data should be the same
  source generate-public-site.py already treats as source of truth for people.html:
  fleet-ops/roster.json (fetched via gh api repos/Twin-Cities-Open-Systems/fleet-ops/contents/roster.json,
  see fetch_roster() in generate-public-site.py) -- reuse that roster directly rather
  than inventing a second identity/people data source. Untested proposal, not a decided
  design.

  '
open_questions:
- 'What "verify" needs to mean for make -org tcos -user paul-style provisioning: exact/case-insensitive
  name match against roster.json? Match by GitHub login? By the new SOA-capsule identity
  (docs/specs/HEE_SOA_CAPSULE.md, human-execution-engine#315, still open) once that
  lands? Needs a real answer before the endpoint''s response shape is fixed.

  '
- 'roster.json is fetched live from fleet-ops via the GitHub API at generate-public-site.py''s
  build time today -- decide whether /api/people should proxy-fetch roster.json live
  per-request (always fresh, adds GitHub API latency/rate-limit exposure to a public
  endpoint) or read a bundled/cached copy the Worker ships with (fast, can go stale)
  before implementing.

  '
- 'roster.json is the public-facing subset already rendered on people.html (name,
  role, github, contract link) -- confirm nothing it holds needs to stay non-public
  before exposing it as a raw JSON API, since an API is a much easier thing to scrape/query
  programmatically than a rendered page.

  '
- 'Cross-reference project_first_human_hire_paul (memory) -- Paul''s onboarding is
  the concrete near-term consumer of exactly this kind of verification, worth designing
  with that real use case in mind rather than in the abstract.

  '
